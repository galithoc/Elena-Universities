name: validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data files
        run: python3 scripts/validate.py
      # On PRs the feed must already be regenerated. On main it is not checked:
      # every app save changes data first and build-ics commits the matching
      # feed a few seconds later, so this check would fail on every tap.
      - name: Check the ICS feed is up to date
        if: github.event_name == 'pull_request'
        run: python3 scripts/build_ics.py --check
