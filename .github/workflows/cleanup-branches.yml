name: cleanup-branches
# TEMPORARY. Deletes the leftover e2e test branch, then removes itself.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete leftover test branch and this workflow
        run: |
          set -euo pipefail
          git push origin --delete e2e-test/pipeline-check || echo "branch already gone"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/cleanup-branches.yml
          git commit -m "Remove temporary branch-cleanup workflow (done)"
          git push origin HEAD:main
          echo "==== remaining branches ===="
          git ls-remote --heads origin
