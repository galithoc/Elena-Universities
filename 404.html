<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Elena Lastname</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nf {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      background: var(--ink);
      color: var(--paper);
    }
    .nf-code {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(4rem, 18vw, 9rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .nf-code span { color: var(--accent); }
    .nf p { opacity: 0.85; margin: 1rem 0 2rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf-code">4<span>0</span>4</p>
      <p>That page took a wrong turn. Let’s get you back on stage.</p>
      <a class="btn btn-solid" href="/">Back to the portfolio</a>
    </div>
  </main>
</body>
</html>
