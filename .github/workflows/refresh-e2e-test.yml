name: refresh-e2e-test
# TEMPORARY, one-off. Verifies the weekly-refresh PR path (branch -> push -> PR)
# end to end using the same action + allowlist. Delete this file after verifying.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          prompt: |
            END-TO-END PIPELINE TEST. Do NOT verify any school, do NOT fetch any
            web page, and do NOT modify, add, or delete anything under data/.
            Your ONLY job is to prove this Action can open a pull request.

            A branch named e2e-test/pipeline-check may already exist from a prior
            run (it already contains E2E_TEST.md). Steps:
            1. Ensure the branch e2e-test/pipeline-check exists and contains a
               root file E2E_TEST.md with one line:
               "End-to-end pipeline test — confirms the weekly-refresh Action can
               create a branch and open a pull request. Throwaway; safe to close."
               (Create the branch/file only if missing; otherwise leave as is.)
            2. Run `python3 scripts/validate.py` and confirm it exits 0.
            3. Push the branch if it has unpushed commits.
            4. Open the pull request with the gh CLI (it is authenticated via the
               GH_TOKEN environment variable):
                 gh pr create --base main --head e2e-test/pipeline-check \
                   --title "[e2e-test] pipeline verification" \
                   --body "Throwaway automation test — confirms the Action can open a PR. Safe to close without merging."
               If a PR for this branch already exists, run `gh pr list --head e2e-test/pipeline-check` and report its URL instead of failing.
            5. Print the PR URL as your final message.
            Do not modify or delete any other file. Do not touch data/.
          claude_args: '--allowedTools "Read,Edit,Write,Glob,Grep,Bash(python3:*),Bash(python:*),Bash(git:*),Bash(gh:*)" --max-turns 60 --model claude-sonnet-5'
