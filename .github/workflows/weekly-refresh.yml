name: weekly-refresh
# Runs the refresh-admissions drill once a week and opens a PR with any changes.
# Requires an ANTHROPIC_API_KEY repository secret
# (Settings -> Secrets and variables -> Actions).
#
# IMPORTANT: claude-code-action denies Bash, WebFetch, and WebSearch by default.
# The drill needs all three (fetch school pages, run the validator, regenerate
# the ICS, push a branch + open a PR). Without the claude_args allowlist below
# the run "succeeds" but does nothing (shows up as permission_denials + no PR).
# Bash is scoped to the exact commands the skill runs since this runs unattended
# against outside web pages.
#
# During the Aug-Oct announcement season you can bump the cadence by editing the
# cron below (e.g. add "0 10 * * 4" for a second weekly run).
on:
  schedule:
    - cron: "0 10 * * 1"      # Mondays 10:00 UTC = 6:00 AM AST
  workflow_dispatch: {}

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          prompt: |
            Run the refresh-admissions skill in --mode=pr. Follow it exactly.
            Re-verify every school's stored source URLs against the live pages,
            update Facts per CLAUDE.md (never silently change a confirmed_2027
            value - use pendingChange), append changelog entries, run
            scripts/validate.py until it passes, regenerate the ICS, and open a
            pull request summarizing what changed. If nothing material changed,
            exit without opening a PR.
          claude_args: '--allowedTools "WebFetch,WebSearch,Read,Edit,Write,Glob,Grep,Bash(python3:*),Bash(python:*),Bash(git:*),Bash(gh:*),mcp__github__create_pull_request" --max-turns 150 --model claude-sonnet-5'
